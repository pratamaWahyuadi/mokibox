# =====================================================
# TikTok Clone Backend MVP - docker-compose
#
# All services run on a single internal bridge network.
# PostgreSQL and Redis are NEVER published to the host
# (NFR-11, SEC-02, SEC-03). Only Nginx publishes 80/443
# to the host.
# =====================================================

name: tiktok-backend

services:
  # -------------------------------------------------
  # PostgreSQL 16 - internal only
  # -------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: tiktok-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend
    # No `ports:` directive on purpose - internal only.

  # -------------------------------------------------
  # Redis 7 - internal only, with password (SEC-03)
  # -------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: tiktok-redis
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - "yes"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend
    # No `ports:` directive on purpose - internal only.

  # -------------------------------------------------
  # Zitadel - self-hosted identity provider
  # (Phase 0 issue: pinned image, reachable via Nginx
  #  at https://auth.example.com -> /zitadel/)
  # Database credentials for Zitadel reuse the postgres
  # superuser; create the `zitadel` DB in bootstrap.
  # -------------------------------------------------
  zitadel:
    image: ghcr.io/zitadel/zitadel:${ZITADEL_VERSION}
    container_name: tiktok-zitadel
    restart: unless-stopped
    command: start-from-init --masterkey "PleaseChangeMeZitadelMasterKey"
    environment:
      ZITADEL_PORT: 8080
      # Public issuer URL - must match the Nginx route
      ZITADEL_EXTERNALDOMAIN: ${ZITADEL_ISSUER_URL}
      ZITADEL_EXTERNALPORT: 443
      ZITADEL_EXTERNALSECURE: "true"
      ZITADEL_TLS_ENABLED: "false"

      # Reuse the same Postgres instance, separate database
      ZITADEL_DATABASE_POSTGRES_HOST: postgres
      ZITADEL_DATABASE_POSTGRES_PORT: 5432
      ZITADEL_DATABASE_POSTGRES_USER: ${POSTGRES_USER}
      ZITADEL_DATABASE_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ZITADEL_DATABASE_POSTGRES_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel

      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "false"
      ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH: /zitadel/bootstrap/login-client.pat
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME: login-client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME: "Automatically Initialized IAM_LOGIN_CLIENT"
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE: 2030-01-01T00:00:00Z
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    # No `ports:` directive on purpose - reachable only
    # through Nginx at /zitadel/.

  # -------------------------------------------------
  # API gateway - Go + Echo (Phase 9 wires the real
  # binary; Phase 0 only needs the service to resolve)
  # -------------------------------------------------
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    image: tiktok-api-gateway:phase0
    container_name: tiktok-api-gateway
    restart: unless-stopped
    environment:
      DATABASE_URL:        ${DATABASE_URL}
      REDIS_ADDR:          ${REDIS_ADDR}
      REDIS_PASSWORD:      ${REDIS_PASSWORD}
      ZITADEL_ISSUER_URL:  ${ZITADEL_ISSUER_URL}
      ZITADEL_API_CLIENT_ID: ${ZITADEL_API_CLIENT_ID}
      R2_ACCOUNT_ID:       ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID:    ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET:           ${R2_BUCKET}
      R2_ENDPOINT:         ${R2_ENDPOINT}
      API_BASE_URL:        ${API_BASE_URL}
      MEDIA_TOKEN_SECRET:  ${MEDIA_TOKEN_SECRET}
      MEDIA_TOKEN_TTL:     ${MEDIA_TOKEN_TTL}
      PRESIGN_UPLOAD_EXPIRY: ${PRESIGN_UPLOAD_EXPIRY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      zitadel:
        condition: service_started
    networks:
      - backend

  # -------------------------------------------------
  # Transcoder worker - Asynq consumer
  # (Phase 5 wires the real binary; Phase 0 only needs
  # the service to resolve)
  # -------------------------------------------------
  transcoder-worker:
    build:
      context: ./transcoder-worker
      dockerfile: Dockerfile
    image: tiktok-transcoder-worker:phase0
    container_name: tiktok-transcoder-worker
    restart: unless-stopped
    # Worker MUST NOT expose any HTTP port.
    expose: []   # explicit - no ports mapped
    environment:
      WORKER_DATABASE_URL: ${WORKER_DATABASE_URL}
      REDIS_ADDR:          ${REDIS_ADDR}
      REDIS_PASSWORD:      ${REDIS_PASSWORD}
      R2_ACCOUNT_ID:       ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID:    ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET:           ${R2_BUCKET}
      R2_ENDPOINT:         ${R2_ENDPOINT}
      TRANSCODE_TIMEOUT:   ${TRANSCODE_TIMEOUT}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Hardening (SEC-02). Real values wired in Phase 5;
    # kept here so the compose file is a single source of
    # truth once the worker is built.
    read_only: true
    tmpfs:
      - /tmp:size=512m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "10001:10001"
    pids_limit: 200
    networks:
      - backend

  # -------------------------------------------------
  # Nginx - the only public entry point
  # -------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: tiktok-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api-gateway
      - zitadel
    networks:
      - backend

# =====================================================
# Internal bridge network - no host network, no external
# =====================================================
networks:
  backend:
    driver: bridge

# =====================================================
# Named volumes for persistent data
# =====================================================
volumes:
  pgdata:
  redisdata:
