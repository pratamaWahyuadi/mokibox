# =====================================================
# MokiBox Backend - docker-compose
#
# MokiBox app services only. The Zitadel identity
# provider is deployed separately (see the sibling
# `zitadel-compose/` directory - it is NOT in this
# repository and is intentionally not merged here).
#
# Rationale: Zitadel v3+ ships as a multi-service
# compose (api + login + Traefik + dedicated Postgres)
# and shares no network/credentials with the MokiBox
# app. Keeping the two compose files separate matches
# the upstream Zitadel layout and avoids the restart
# loop we hit when we tried to run Zitadel v2 as a
# single container inside the app stack.
#
# All app services run on a single internal bridge
# network. PostgreSQL and Redis are NEVER published
# to the host (NFR-11, SEC-02, SEC-03). Only Nginx
# publishes 80/443 to the host.
#
# Bring-up order on a fresh VPS:
#   1. cd ../zitadel-compose && docker compose up -d
#      (or `make up-zitadel` from this directory)
#   2. make up                         (MokiBox services)
#
# The api-gateway reads ZITADEL_ISSUER_URL from env and
# calls out to the Zitadel stack over the host network.
# It does NOT depend on a `zitadel` service in this
# compose file.
# =====================================================

name: mokibox

services:
  # -------------------------------------------------
  # PostgreSQL 16 - internal only (MokiBox app DB)
  # -------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: mokibox-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend
    # No `ports:` directive on purpose - internal only.

  # -------------------------------------------------
  # Redis 7 - internal only, with password (SEC-03)
  # -------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: mokibox-redis
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - "yes"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend
    # No `ports:` directive on purpose - internal only.

  # -------------------------------------------------
  # API gateway - Go + Echo
  # (Phase 3 ships the auth + user + webhook code;
  #  phase 9 wires the production main + validator.)
  #
  # The api-gateway talks to Zitadel over the host
  # network using ZITADEL_ISSUER_URL. There is no
  # `zitadel` service in this compose - it lives in
  # the separate zitadel-compose project.
  # -------------------------------------------------
  api-gateway:
    # Build context MUST be the repo root (.) not
    # ./api-gateway: the Dockerfile copies go.mod /
    # go.sum from the context root and the binary
    # imports the shared/ package at
    # github.com/pratamaWahyuadi/mokibox/shared.
    # See mokibox-go-shared SKILL.md "Docker build
    # context untuk multi-package Go module" for the
    # full pitfall description and symptom.
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    image: mokibox-api-gateway:dev
    container_name: mokibox-api-gateway
    restart: unless-stopped
    environment:
      DATABASE_URL:        ${DATABASE_URL}
      REDIS_ADDR:          ${REDIS_ADDR}
      REDIS_PASSWORD:      ${REDIS_PASSWORD}
      ZITADEL_ISSUER_URL:  ${ZITADEL_ISSUER_URL}
      ZITADEL_CLIENT_ID:     ${ZITADEL_CLIENT_ID}
      ZITADEL_API_CLIENT_ID: ${ZITADEL_API_CLIENT_ID}
      ZITADEL_TARGET_SIGNING_KEY: ${ZITADEL_TARGET_SIGNING_KEY}
      R2_ACCOUNT_ID:       ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID:    ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET:           ${R2_BUCKET}
      R2_ENDPOINT:         ${R2_ENDPOINT}
      API_BASE_URL:        ${API_BASE_URL}
      MEDIA_TOKEN_SECRET:  ${MEDIA_TOKEN_SECRET}
      MEDIA_TOKEN_TTL:     ${MEDIA_TOKEN_TTL}
      PRESIGN_UPLOAD_EXPIRY: ${PRESIGN_UPLOAD_EXPIRY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Hardening (SEC-02, issue #31). The gateway processes
    # unauthenticated traffic (JWTs, webhooks with HMAC) but
    # never untrusted media, so the sandbox is tight but a
    # notch below the worker's (no read_only tmpfs dance -
    # the binary needs no writable paths at all beyond
    # what the OS provides, and distroless has no shell to
    # protect anyway):
    #   - read_only root FS: the gateway never writes to
    #     disk (stateless; logs go to stdout)
    #   - cap_drop ALL + no-new-privileges
    #   - pids_limit 200 bounds a request-storm fork burst
    #   - mem_limit 512m + cpus 1.0 bounds the whole
    #     service on the single VPS
    #   - user left to the image (distroless nonroot,
    #     UID 65532); an explicit user: key here would
    #     conflict with the image's own USER directive
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 200
    mem_limit: 512m
    cpus: "1.0"
    networks:
      - backend

  # -------------------------------------------------
  # Transcoder worker - Asynq consumer
  # (Phase 5 wires the real binary; current image is
  #  a phase-0 placeholder.)
  # -------------------------------------------------
  transcoder-worker:
    build:
      # The worker shares a single Go module with the
      # api-gateway (rooted at the repo root), so the
      # build context must include go.mod / go.sum and
      # the shared/ package. ./transcoder-worker/Dockerfile
      # is the relative path under that context.
      context: .
      dockerfile: transcoder-worker/Dockerfile
    image: mokibox-transcoder-worker:dev
    container_name: mokibox-transcoder-worker
    restart: unless-stopped
    # Worker MUST NOT expose any HTTP port.
    expose: []   # explicit - no ports mapped
    environment:
      WORKER_DATABASE_URL: ${WORKER_DATABASE_URL}
      REDIS_ADDR:          ${REDIS_ADDR}
      REDIS_PASSWORD:      ${REDIS_PASSWORD}
      R2_ACCOUNT_ID:       ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID:    ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET:           ${R2_BUCKET}
      R2_ENDPOINT:         ${R2_ENDPOINT}
      TRANSCODE_TIMEOUT:   ${TRANSCODE_TIMEOUT}
      # R2 orphan reconciliation (issue #44). The worker
      # enqueues reconcile:tick on this cadence (default 1h)
      # and examines up to RECONCILE_BATCH tombstoned users
      # per tick. DRY_RUN=true logs orphan candidates without
      # enqueuing cleanup.
      RECONCILE_INTERVAL:   ${RECONCILE_INTERVAL:-1h}
      RECONCILE_BATCH:     ${RECONCILE_BATCH:-100}
      RECONCILE_DRY_RUN:   ${RECONCILE_DRY_RUN:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Hardening (SEC-02). The worker processes untrusted
    # uploads so we tighten the sandbox as much as
    # compose / linux lets us:
    #   - read_only root FS (no on-disk writes outside /tmp)
    #   - tmpfs /tmp with sticky bit + 512M cap, owned by
    #     the same UID as the binary (10001) so ffmpeg's
    #     temp files are writable
    #   - cap_drop ALL + no-new-privileges (drop setuid
    #     escalation vectors)
    #   - pids_limit 100 to bound runaway fork bombs
    #     from a hostile media file
    #   - mem_limit 2g + cpus 1.5 to bound the impact of
    #     a single stuck job on the host VPS
    #   - explicit user 10001:10001 matches the Dockerfile
    #     USER directive
    read_only: true
    tmpfs:
      - /tmp:size=512M,mode=1777,uid=10001,gid=10001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "10001:10001"
    pids_limit: 100
    mem_limit: 2g
    cpus: "1.5"
    networks:
      - backend

  # -------------------------------------------------
  # Nginx - the only public entry point for the app
  # Zitadel serves itself through its own Traefik in
  # the sibling zitadel-compose project.
  # -------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: mokibox-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api-gateway
    # Hardening (SEC-02, issue #31). Nginx is the only
    # internet-facing service. The docker-entrypoint needs
    # CHOWN (it chowns /var/cache/nginx to the nginx worker
    # UID 101 at startup) and the root master needs
    # SETGID/SETUID/NET_BIND_SERVICE (bind :80/:443, drop
    # to worker user), so those four stay; everything else
    # the default image caps are dropped:
    #   - cap_drop [AUDIT_WRITE, DAC_OVERRIDE, FOWNER,
    #     FSETID, KILL, MKNOD, NET_RAW, SETFCAP, SETPCAP,
    #     SYS_CHROOT]
    #   - no-new-privileges
    #   - read_only root FS + tmpfs for nginx runtime
    #     writes (/var/cache/nginx, /var/run, /var/log)
    #   - pids_limit + mem_limit bound a request storm
    cap_drop:
      - AUDIT_WRITE
      - DAC_OVERRIDE
      - FOWNER
      - FSETID
      - KILL
      - MKNOD
      - NET_RAW
      - SETFCAP
      - SETPCAP
      - SYS_CHROOT
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=64M,mode=1777
      - /var/run:size=16M,mode=1777
      - /var/log/nginx:size=32M,mode=1777
    pids_limit: 100
    mem_limit: 256m
    cpus: "0.5"
    networks:
      - backend

# =====================================================
# Internal bridge network - no host network, no external
# =====================================================
networks:
  backend:
    driver: bridge

# =====================================================
# Named volumes for persistent MokiBox app data
# (Zitadel has its own volumes in zitadel-compose.)
# =====================================================
volumes:
  pgdata:
  redisdata:
