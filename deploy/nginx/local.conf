# =====================================================
# Nginx - LOCAL-ONLY config for the *.localhost
# integration smoke environment (Fase 10 issue #30).
#
# DO NOT USE IN PRODUCTION. Production default.conf
# lives alongside this file and handles TLS + ACME.
# This file is mounted by docker-compose.override.yml
# to /etc/nginx/conf.d/default.conf so the override
# transparently swaps the production config out for
# local testing without editing default.conf.
#
# Two server blocks:
#   - auth.localhost -> zitadel-proxy:80 (Zitadel
#     Traefik; routes /api -> zitadel-api, /ui/v2/login
#     -> zitadel-login via Traefik labels).
#   - api.localhost  -> api-gateway:8080 (MokiBox).
#
# No TLS. No cert. No ACME. Host port 80 -> this Nginx
# is the ONLY entry point from the host; Zitadel
# Traefik is not published to the host (see
# docker-compose.override.yml networks block).
# =====================================================

# -------------------------------------------------------------
# auth.localhost -> Zitadel (Traefik in zitadel compose)
# -------------------------------------------------------------
# Why route to Traefik rather than directly to zitadel-api?
# The login UI (zitadel-login:3000) and the gRPC Connect-RPC
# for the API (zitadel-api:8080) are stitched together by
# Traefik labels using path-based rules. Replicating those
# rules in Nginx would be brittle; sending every auth.*
# request to Traefik and letting it route is the path of
# least resistance and matches what production would do if
# a TLS-terminating CDN were in front.
# -------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name auth.localhost;

    # 10 MB covers the largest OIDC payload (token request
    # body is normally a few KB; the limit is high to absorb
    # token introspection round-trips that occasionally carry
    # larger JWTs in the assertion field).
    client_max_body_size 10m;
    client_body_timeout  60s;

    location / {
        # Upstream hostname notes (do not "fix" this to
        # zitadel-proxy): inside the external `zitadel`
        # network, the Traefik container is reachable via
        # its compose SERVICE name (`proxy`) or its
        # container name (`zitadel-proxy-1`). `proxy` is
        # stable across container recreations, so we use
        # that. Traefik listens on container port 80.
        proxy_pass http://proxy:80;
        proxy_http_version 1.1;
        # Forward Host as-is so Traefik's Host(`auth.localhost`)
        # rules match.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Traefik speaks h2c to the backend; tell the client
        # we close the upstream connection so a slow login
        # does not pin a worker.
        proxy_set_header Connection        "";
        # Login UI pages can take a few seconds (DB writes
        # for first-login, MFA setup, etc.) so a generous
        # read timeout.
        proxy_read_timeout 60s;
    }
}

# -------------------------------------------------------------
# api.localhost -> MokiBox api-gateway
# -------------------------------------------------------------
# Mirrors the production HTTPS server block in default.conf
# minus TLS / ACME / security headers. Request body limit
# kept at 1 MB so the upload-intent / confirm endpoints
# reject oversized bodies with 413 just like production.
# -------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.localhost;

    client_max_body_size 1m;
    client_body_timeout  60s;

    # Health check
    location = /healthz {
        proxy_pass http://api-gateway:8080/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API + webhook
    location / {
        proxy_pass http://api-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
    }
}
