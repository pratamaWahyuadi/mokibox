# =====================================================
# Nginx - single public entry point for the MokiBox
# app API. Only ports 80/443 are published; PostgreSQL,
# Redis, and Zitadel are reachable only through their
# respective internal Docker networks.
#
# Zitadel is NOT routed through this Nginx. The
# Zitadel identity provider is deployed as a separate
# compose project (../zitadel-compose/) that ships
# its own Traefik reverse proxy. MokiBox services
# only need to talk to Zitadel over the network to
# fetch JWKS and verify JWTs.
# =====================================================

# Redirect HTTP -> HTTPS (TLS termination via certbot / own certs)
server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    # ACME http-01 challenge (certbot) needs to reach /.well-known/
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# =====================================================
# api.example.com  - public API + Zitadel Actions V2
# webhook target. Zitadel itself is reached over the
# network at $ZITADEL_ISSUER_URL; Nginx does NOT
# reverse-proxy Zitadel traffic.
# =====================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.example.com;

    # --- TLS ---
    ssl_certificate     /etc/nginx/certs/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/api.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # --- Security headers (SEC-07) ---
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy            "no-referrer" always;

    # Upload video goes DIRECTLY from client to R2 via presigned
    # URL, so we cap body size at 1 MB for everything that DOES
    # go through the gateway.
    client_max_body_size 1m;
    client_body_timeout  60s;

    # --- Healthcheck (no auth) ---
    location = /healthz {
        proxy_pass http://api-gateway:8080/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- API gateway (JWT-protected) ---
    location /api/ {
        proxy_pass http://api-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
    }
}
