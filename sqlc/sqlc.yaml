version: "2"
sql:
  - engine: "postgresql"
    schema:
      - "../migrations/001_init.sql"
      - "../migrations/008_user_avatar_upload.sql"
      - "../migrations/009_dm_e2ee.sql"
      - "../migrations/010_dm_inbox_sender_fk.sql"
      - "../migrations/011_dm_fallback_keys.sql"
      - "../migrations/012_marketplace.sql"
      - "../migrations/013_marketplace_cleanup_outbox.sql"
      - "../migrations/014_marketplace_location.sql"
      - "../migrations/015_dm_authorization_hardening.sql"
    # Queries live in per-table files under sqlc/queries/.
    # sqlc picks up every *.sql file in the directory in
    # alphabetical order; split was introduced in phase-1.5
    # to make each table's query surface easy to read and
    # diff in isolation.
    queries: "queries"
    gen:
      go:
        package: "db"
        out: "../shared/db"
        emit_json_tags: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
